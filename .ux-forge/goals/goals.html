<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Goals – Zamane</title>
<meta name="theme-color" content="#f8f3ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161d" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Young+Serif&display=swap">
<!-- Shared layer first; each view owns one stylesheet and one script. -->
<link rel="stylesheet" href="zamane.css">
<link rel="stylesheet" href="list.css">
<link rel="stylesheet" href="detail.css">
<link rel="stylesheet" href="composer.css">
<link rel="stylesheet" href="form.css">
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>

<header class="app-header">
  <div class="wrap bar">
    <a class="brand" href="../home/home.html">
      <img class="logo-light" src="../../assets/zamane-logo.svg" alt="Zamane" width="125" height="36">
      <img class="logo-dark" src="../../assets/zamane-logo-dark.svg" alt="Zamane" width="125" height="36">
    </a>
    <nav class="nav" aria-label="Main">
      <ul class="nav-list" role="list">
        <li><a class="nav-link" href="../home/home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="nav-label">Home</span></a></li>
        <li><a class="nav-link" href="#/goals" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 13V2l8 4-8 4"/><path d="M20.561 10.222a9 9 0 1 1-12.55-5.29"/><path d="M8.002 9.997a5 5 0 1 0 8.9 2.02"/></svg><span class="nav-label">Goals</span></a></li>
        <li><a class="nav-link" href="#/trips"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg><span class="nav-label">Trips</span></a></li>
        <li><a class="nav-link" href="#/shopping"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 11-1 9"/><path d="m19 11-4-7"/><path d="M2 11h20"/><path d="m3.5 11 1.6 7.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6l1.7-7.4"/><path d="M4.5 15.5h15"/><path d="m5 11 4-7"/><path d="m9 11 1 9"/></svg><span class="nav-label">Shopping</span></a></li>
        <li><a class="nav-link" href="#/profile"><span class="zm-av zm-av-a zm-av-sm" aria-hidden="true">S</span><span class="nav-label">Profile</span></a></li>
      </ul>
    </nav>
  </div>
</header>

<main id="main" class="wrap" tabindex="-1">
  <!-- Fixed on screen; shared.js keeps it right after the view's floating primary in the DOM. -->
  <div id="toast" class="toast" hidden>
    <div class="toast-text"><span class="toast-title"></span><span class="toast-msg"></span></div>
    <button class="toast-undo" type="button" hidden>Undo</button>
  </div>
  <div id="view"></div>
  <p class="caption footnote" id="footnote"></p>
</main>

<div id="live" class="vh" role="status" aria-live="polite"></div>

<!-- Home's quick-add sheet, opened at step B with the goal pre-picked -->
<dialog id="sheet" class="sheet" aria-labelledby="sheet-h">
  <div class="sheet-head">
    <div><h2 id="sheet-h">Add to a goal</h2><p id="sheet-sub" class="caption"></p></div>
    <button class="icon-btn" type="button" id="sheet-close" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
  <div id="sheet-body"></div>
  <p id="sheet-live" class="vh dlg-live" role="status"></p>
  <p id="sheet-alert" class="vh" role="alert"></p>
</dialog>

<!-- Shared confirmation for destructive acts: the safe button first and focused; Esc keeps -->
<dialog id="confirm" class="sheet confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-h" aria-describedby="confirm-body">
  <h2 id="confirm-h"></h2>
  <div id="confirm-body" class="confirm-body"></div>
  <div class="sheet-actions">
    <button id="confirm-cancel" class="btn-sec" type="button">Keep it</button>
    <button id="confirm-ok" class="btn-danger" type="button"></button>
  </div>
  <p class="vh dlg-live" role="status"></p>
</dialog>

<script src="shared.js"></script>
<script src="list.js"></script>
<script src="detail.js"></script>
<script src="composer.js"></script>
<script src="form.js"></script>
<script>Z.start();</script>
</body>
</html>
